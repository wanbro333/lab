name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lab_ci
          MYSQL_ROOT_PASSWORD: ci-only-ephemeral-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DJANGO_SECRET_KEY: ci-only-ephemeral-secret-not-for-deployment
      DJANGO_DEBUG: 'true'
      MYSQL_DATABASE: lab_ci
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-only-ephemeral-password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential
      - run: python -m pip install -r requirements.txt
      - run: python backend/manage.py check --database default
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test apps
